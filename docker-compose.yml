services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_PATH=/app/data/matura.sqlite
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_STT_MODEL=${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      - GROQ_LLM_MODEL=${GROQ_LLM_MODEL:-llama-3.3-70b-versatile}
      # NextAuth v5 reads AUTH_SECRET; NEXTAUTH_SECRET is kept for v4 compat.
      # Set at least one of them.
      - AUTH_SECRET=${AUTH_SECRET:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_BASEURL=${LANGFUSE_BASEURL:-https://cloud.langfuse.com}
    volumes:
      # Persistent volume for SQLite — prevents data loss on container updates
      - sqlite-data:/app/data
    restart: unless-stopped

volumes:
  sqlite-data:
    driver: local
